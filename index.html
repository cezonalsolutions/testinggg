<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>CEZOO ₹1 UPI Test</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#f5f7f6;

  font-family:Arial, Helvetica, sans-serif;
}

.card{
  width:100%;
  max-width:400px;

  background:#ffffff;

  border-radius:22px;

  padding:28px 20px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.08);
}

.logo{
  text-align:center;

  font-size:30px;
  font-weight:900;

  color:#16a34a;

  margin-bottom:8px;
}

.subtitle{
  text-align:center;

  font-size:13px;

  color:#777;

  margin-bottom:28px;
}

.amount-box{
  padding:18px;

  border-radius:16px;

  background:#f2fff6;

  text-align:center;

  margin-bottom:20px;
}

.amount-label{
  font-size:12px;

  color:#777;

  margin-bottom:5px;
}

.amount{
  font-size:32px;

  font-weight:900;

  color:#111;
}

label{
  display:block;

  font-size:13px;
  font-weight:700;

  color:#333;

  margin-bottom:8px;
}

.mobile-wrap{
  display:flex;

  border:1.5px solid #dedede;

  border-radius:14px;

  overflow:hidden;

  height:52px;

  margin-bottom:18px;
}

.country{
  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 14px;

  background:#f7f7f7;

  font-weight:700;

  border-right:1px solid #e4e4e4;
}

input{
  flex:1;

  border:none;

  outline:none;

  padding:0 14px;

  font-size:16px;
}

.pay-btn{
  width:100%;
  height:52px;

  border:none;

  border-radius:14px;

  background:#16a34a;

  color:#fff;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
}

.pay-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  min-height:22px;

  margin-top:16px;

  text-align:center;

  font-size:13px;

  color:#555;
}

.loader{
  display:none;

  width:22px;
  height:22px;

  margin:18px auto 0;

  border:3px solid #e5e5e5;

  border-top-color:#16a34a;

  border-radius:50%;

  animation:spin .7s linear infinite;
}

.loader.show{
  display:block;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.success{
  color:#16a34a;
  font-weight:700;
}

.error{
  color:#ef4444;
  font-weight:700;
}

</style>

</head>

<body>

<div class="card">

  <div class="logo">
    CEZOO
  </div>

  <div class="subtitle">
    Razorpay UPI Intent Test
  </div>

  <div class="amount-box">

    <div class="amount-label">
      Test Amount
    </div>

    <div class="amount">
      ₹1
    </div>

  </div>

  <label>
    Mobile Number
  </label>

  <div class="mobile-wrap">

    <div class="country">
      +91
    </div>

    <input
      id="mobile"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter mobile number"
    >

  </div>

  <button
    id="payBtn"
    class="pay-btn"
  >
    Pay ₹1 with UPI
  </button>

  <div
    id="loader"
    class="loader"
  ></div>

  <div
    id="status"
    class="status"
  ></div>

</div>


<script>

const BACKEND_URL =
  "https://razropay.onrender.com";


// IMPORTANT:
//
// Use the Razorpay TEST key here
// while testing.
//
// Example:
// rzp_test_xxxxxxxxxx
//
const RAZORPAY_KEY = "rzp_live_SqrUSaPO5pA6gt";


const mobileInput =
  document.getElementById("mobile");

const payBtn =
  document.getElementById("payBtn");

const statusBox =
  document.getElementById("status");

const loader =
  document.getElementById("loader");


mobileInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value.replace(/\D/g,"").slice(0,10);

  }
);


function setLoading(value){

  payBtn.disabled = value;

  loader.classList.toggle(
    "show",
    value
  );

  payBtn.innerText =
    value
      ? "Creating ₹1 Order..."
      : "Pay ₹1 with UPI";

}


function showStatus(
  message,
  type = ""
){

  statusBox.className =
    "status " + type;

  statusBox.innerText =
    message;

}


payBtn.addEventListener(
  "click",
  async function(){

    const mobile =
      mobileInput.value.trim();


    if(!/^[6-9]\d{9}$/.test(mobile)){

      showStatus(
        "Enter valid 10 digit mobile number",
        "error"
      );

      return;

    }


    try{

      showStatus("");

      setLoading(true);


      /* ==============================
         CREATE ₹1 RAZORPAY ORDER
      ============================== */

      const response =
        await fetch(
          BACKEND_URL + "/create-order",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              amount:100
            })
          }
        );


      const data =
        await response.json();


      console.log(
        "CREATE ORDER:",
        data
      );


      if(
        !response.ok ||
        !data?.success ||
        !data?.order?.id
      ){

        throw new Error(
          data?.message ||
          "Unable to create order"
        );

      }


      setLoading(false);


      /* ==============================
         RAZORPAY UPI CHECKOUT
      ============================== */

      const options = {

        key:
          RAZORPAY_KEY,

        amount:
          data.order.amount,

        currency:
          data.order.currency || "INR",

        order_id:
          data.order.id,


        name:
          "CEZOO",

        description:
          "₹1 UPI Test",


        prefill:{

          contact:
            mobile

        },


        theme:{

          color:
            "#16a34a"

        },


        /* =========================
           UPI ONLY CONFIG
        ========================= */

        config:{

          display:{

            blocks:{

              upi:{

                name:
                  "Pay with UPI",

                instruments:[
                  {
                    method:"upi"
                  }
                ]

              }

            },

            sequence:[
              "block.upi"
            ],

            preferences:{

              show_default_blocks:
                false

            }

          }

        },


        handler:
          function(paymentResponse){

            console.log(
              "PAYMENT SUCCESS:",
              paymentResponse
            );


            showStatus(
              "Payment successful ✅",
              "success"
            );


            console.log(
              "Payment ID:",
              paymentResponse
                .razorpay_payment_id
            );


            console.log(
              "Order ID:",
              paymentResponse
                .razorpay_order_id
            );


            console.log(
              "Signature:",
              paymentResponse
                .razorpay_signature
            );

          },


        modal:{

          ondismiss:
            function(){

              showStatus(
                "Payment cancelled"
              );

            }

        }

      };


      const razorpay =
        new Razorpay(options);


      razorpay.on(
        "payment.failed",
        function(response){

          console.error(
            "PAYMENT FAILED:",
            response.error
          );


          showStatus(
            response.error?.description ||
            "Payment failed",
            "error"
          );

        }
      );


      razorpay.open();


    }catch(error){

      console.error(
        "PAYMENT ERROR:",
        error
      );


      setLoading(false);


      showStatus(
        error.message ||
        "Unable to start payment",
        "error"
      );

    }

  }
);

</script>

</body>
</html>
