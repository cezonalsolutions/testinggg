<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Café</title>

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
}

body{
  background:#fff;
}


/* =========================
   BANNER
========================= */

.banner{
  width:100%;
  height:175px;

  position:relative;
  overflow:hidden;

  background:#7b12df;

  border-radius:
    0 0 50% 50% /
    0 0 28px 28px;
}


/* =========================
   SMALL CEZOO CAFÉ LOGO
========================= */

.cafeLogo{
  position:absolute;

  left:50%;
  top:48%;

  transform:translate(-50%,-50%);

  display:inline-block;

  color:#fff;

  z-index:3;

  pointer-events:none;
}


/* CAFÉ */

.cafeLogo .cafeText{
  font-family:'DM Serif Display', serif;

  font-size:72px;
  font-weight:400;

  line-height:.85;

  letter-spacing:-5px;

  color:#fff;

  white-space:nowrap;
}


/* CEZOO ABOVE "ca" */

.cafeLogo .cezooText{
  position:absolute;

  top:3px;
  left:5px;

  width:73px;

  text-align:center;

  font-family:'Bungee', sans-serif;

  font-size:14px;
  font-weight:400;

  letter-spacing:-.5px;

  line-height:1;

  color:#fff;

  white-space:nowrap;
}


/* =========================
   STATIC LIGHTS
========================= */

.cafeLights{
  position:absolute;

  top:0;

  width:155px;
  height:70px;

  z-index:2;

  pointer-events:none;
}

.cafeLights.left{
  left:0;
}

.cafeLights.right{
  right:0;
}


/* =========================
   WIRE
========================= */

.wire{
  position:absolute;

  top:-18px;

  width:165px;
  height:57px;

  border-bottom:
    2px solid rgba(34,20,45,.72);
}

.left .wire{
  left:-15px;

  border-radius:0 0 85% 0;

  transform:rotate(2deg);
}

.right .wire{
  right:-15px;

  border-radius:0 0 0 85%;

  transform:rotate(-2deg);
}


/* =========================
   LIGHT STEM
========================= */

.light{
  position:absolute;

  width:2px;

  background:rgba(40,24,48,.75);
}


/* BULB CAP */

.light::before{
  content:"";

  position:absolute;

  left:50%;
  bottom:-3px;

  width:7px;
  height:5px;

  transform:translateX(-50%);

  background:#33263b;

  border-radius:2px 2px 1px 1px;
}


/* BULB */

.light::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-13px;

  width:10px;
  height:12px;

  transform:translateX(-50%);

  background:#ffd85a;

  border-radius:50% 50% 55% 55%;

  box-shadow:
    0 0 5px rgba(255,216,90,.95),
    0 0 11px rgba(255,190,55,.55);
}


/* LEFT LIGHTS */

.left .l1{
  left:12px;
  top:3px;
  height:9px;
}

.left .l2{
  left:43px;
  top:8px;
  height:14px;
}

.left .l3{
  left:76px;
  top:14px;
  height:18px;
}

.left .l4{
  left:111px;
  top:20px;
  height:20px;
}

.left .l5{
  left:143px;
  top:24px;
  height:19px;
}


/* RIGHT LIGHTS */

.right .l1{
  right:12px;
  top:3px;
  height:9px;
}

.right .l2{
  right:43px;
  top:8px;
  height:14px;
}

.right .l3{
  right:76px;
  top:14px;
  height:18px;
}

.right .l4{
  right:111px;
  top:20px;
  height:20px;
}

.right .l5{
  right:143px;
  top:24px;
  height:19px;
}


/* =========================
   MOVING BIKE GROUP
========================= */

.cafeMover{
  position:absolute;

  left:0;
  top:50%;

  width:78px;
  height:78px;

  z-index:5;

  animation:
    cafeBikeMove 8s linear infinite;

  will-change:transform;
}


/* =========================
   SMALL BIKE IMAGE
========================= */

.cafeImage{
  position:absolute;

  width:68px;
  height:68px;

  left:5px;
  top:5px;

  object-fit:contain;

  z-index:3;
}


/* =========================
   SPEED WAVES
========================= */

.speedWaves{
  position:absolute;

  right:56px;
  top:50%;

  width:68px;
  height:48px;

  transform:translateY(-50%);

  z-index:1;
}


.wave{
  position:absolute;

  right:0;

  height:2px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.18),
    rgba(255,255,255,.75)
  );

  border-radius:50px;

  animation:
    speedTrail 1.1s ease-out infinite;
}


.wave1{
  width:34px;
  top:7px;
}

.wave2{
  width:50px;
  top:18px;
  animation-delay:.12s;
}

.wave3{
  width:41px;
  top:30px;
  animation-delay:.24s;
}

.wave4{
  width:26px;
  top:40px;
  animation-delay:.36s;
}


/* =========================
   WAVE ANIMATION
========================= */

@keyframes speedTrail{

  0%{
    transform:
      translateX(8px)
      scaleX(.55);

    opacity:0;
  }

  35%{
    opacity:.75;
  }

  70%{
    transform:
      translateX(-3px)
      scaleX(1);

    opacity:.65;
  }

  100%{
    transform:
      translateX(-12px)
      scaleX(1.08);

    opacity:0;
  }

}


/* =========================
   BIKE MOVEMENT
========================= */

@keyframes cafeBikeMove{

  0%{
    transform:
      translate(-110px,4px);
  }

  10%{
    transform:
      translate(1vw,1px);
  }


  /* SLOW */

  15%{
    transform:
      translate(5vw,0px);
  }

  20%{
    transform:
      translate(9vw,-1px);
  }

  25%{
    transform:
      translate(13vw,-2px);
  }

  30%{
    transform:
      translate(17vw,-3px);
  }

  35%{
    transform:
      translate(21vw,-4px);
  }

  40%{
    transform:
      translate(25vw,-5px);
  }


  /* SPEED PICKUP */

  45%{
    transform:
      translate(31vw,-6px);
  }

  50%{
    transform:
      translate(39vw,-7px);
  }

  55%{
    transform:
      translate(49vw,-8px);
  }


  /* FAST */

  60%{
    transform:
      translate(60vw,-7px);
  }

  68%{
    transform:
      translate(72vw,-5px);
  }

  76%{
    transform:
      translate(83vw,-3px);
  }

  84%{
    transform:
      translate(93vw,-1px);
  }

  92%{
    transform:
      translate(105vw,1px);
  }

  100%{
    transform:
      translate(
        calc(100vw + 120px),
        3px
      );
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .banner{
    height:155px;

    border-radius:
      0 0 50% 50% /
      0 0 22px 22px;
  }


  /* LOGO */

  .cafeLogo .cafeText{
    font-size:58px;
    letter-spacing:-4px;
  }

  .cafeLogo .cezooText{
    top:2px;
    left:4px;

    width:59px;

    font-size:11px;
    letter-spacing:-.4px;
  }


  /* LIGHTS */

  .cafeLights{
    width:115px;
    height:60px;
  }

  .wire{
    width:125px;
    height:48px;
  }

  .left .l1{left:8px;}
  .left .l2{left:31px;}
  .left .l3{left:56px;}
  .left .l4{left:82px;}
  .left .l5{left:108px;}

  .right .l1{right:8px;}
  .right .l2{right:31px;}
  .right .l3{right:56px;}
  .right .l4{right:82px;}
  .right .l5{right:108px;}

  .light::after{
    width:8px;
    height:10px;
  }


  /* SMALL BIKE */

  .cafeMover{
    width:66px;
    height:66px;
  }

  .cafeImage{
    width:58px;
    height:58px;

    left:4px;
    top:4px;
  }


  /* SMALL WAVES */

  .speedWaves{
    right:48px;

    width:54px;
    height:42px;
  }

  .wave1{
    width:27px;
    top:6px;
  }

  .wave2{
    width:39px;
    top:16px;
  }

  .wave3{
    width:32px;
    top:26px;
  }

  .wave4{
    width:20px;
    top:35px;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:390px){

  .banner{
    height:145px;
  }

  .cafeLogo .cafeText{
    font-size:53px;
    letter-spacing:-3.5px;
  }

  .cafeLogo .cezooText{
    top:2px;
    left:3px;

    width:55px;

    font-size:10px;
  }


  /* EVEN SMALLER BIKE */

  .cafeMover{
    width:62px;
    height:62px;
  }

  .cafeImage{
    width:54px;
    height:54px;

    left:4px;
    top:4px;
  }

  .speedWaves{
    right:45px;
  }

}

</style>
</head>

<body>

<section class="banner">


  <!-- CEZOO CAFÉ -->

  <div class="cafeLogo">

    <div class="cezooText">
      CEZOO
    </div>

    <div class="cafeText">
      café
    </div>

  </div>


  <!-- LEFT LIGHTS -->

  <div class="cafeLights left">

    <div class="wire"></div>

    <span class="light l1"></span>
    <span class="light l2"></span>
    <span class="light l3"></span>
    <span class="light l4"></span>
    <span class="light l5"></span>

  </div>


  <!-- RIGHT LIGHTS -->

  <div class="cafeLights right">

    <div class="wire"></div>

    <span class="light l1"></span>
    <span class="light l2"></span>
    <span class="light l3"></span>
    <span class="light l4"></span>
    <span class="light l5"></span>

  </div>


  <!-- MOVING BIKE -->

  <div class="cafeMover">

    <div class="speedWaves">

      <span class="wave wave1"></span>
      <span class="wave wave2"></span>
      <span class="wave wave3"></span>
      <span class="wave wave4"></span>

    </div>

    <img
      src="BIKE.webp"
      class="cafeImage"
      alt=""
    >

  </div>


</section>

</body>
</html>
