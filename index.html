<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO UPI Payment</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f7f6;
    font-family:Arial, sans-serif;
    padding:20px;
}

.payment-card{
    width:100%;
    max-width:390px;
    background:#fff;
    border-radius:22px;
    padding:26px 20px;
    box-shadow:0 12px 40px rgba(0,0,0,.08);
}

.brand{
    text-align:center;
    font-size:30px;
    font-weight:900;
    color:#16a34a;
}

.sub{
    text-align:center;
    margin-top:5px;
    font-size:12px;
    color:#777;
}

.amount-box{
    margin-top:24px;
    padding:20px;
    border-radius:16px;
    background:#f1fff6;
    text-align:center;
}

.amount-label{
    font-size:12px;
    color:#777;
}

.amount{
    margin-top:5px;
    font-size:42px;
    font-weight:900;
}

.title{
    margin-top:24px;
    margin-bottom:10px;
    font-size:13px;
    font-weight:800;
}

.pay-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:14px;
    margin-top:10px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.pay-btn:active{
    transform:scale(.98);
}

.phonepe{
    background:#5f259f;
    color:#fff;
}

.paytm{
    background:#00baf2;
    color:#fff;
}

.status{
    margin-top:16px;
    min-height:18px;
    text-align:center;
    font-size:12px;
    color:#666;
}

.status.error{
    color:#dc2626;
}

.status.success{
    color:#16a34a;
    font-weight:800;
}

/* LOADER */

.loader-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.96);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    z-index:999999;
}

.loader-overlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.loader-box{
    text-align:center;
}

.spinner{
    width:44px;
    height:44px;
    border:4px solid #e5e5e5;
    border-top-color:#16a34a;
    border-radius:50%;
    margin:auto;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loader-text{
    margin-top:14px;
    font-size:14px;
    font-weight:800;
    color:#222;
}

.loader-sub{
    margin-top:5px;
    font-size:11px;
    color:#777;
}
</style>
</head>

<body>

<div class="payment-card">

    <div class="brand">CEZOO</div>

    <div class="sub">
        Secure UPI Payment
    </div>

    <div class="amount-box">

        <div class="amount-label">
            Amount to Pay
        </div>

        <div class="amount">
            ₹1
        </div>

    </div>

    <div class="title">
        Choose payment option
    </div>

    <button
        class="pay-btn phonepe"
        onclick="startPayment('phonepe')"
    >
        Pay with PhonePe
    </button>

    <button
        class="pay-btn paytm"
        onclick="startPayment('paytm')"
    >
        Pay with Paytm
    </button>

    <div
        id="status"
        class="status"
    ></div>

</div>


<!-- LOADER -->

<div
    id="loader"
    class="loader-overlay"
>

    <div class="loader-box">

        <div class="spinner"></div>

        <div
            id="loaderText"
            class="loader-text"
        >
            Preparing payment...
        </div>

        <div class="loader-sub">
            Please wait
        </div>

    </div>

</div>


<script>

const BACKEND =
    "https://razropay.onrender.com";

const RAZORPAY_KEY =
    "rzp_live_SqrUSaPO5pA6gt";


let paymentRunning = false;


function showLoader(text){

    document.getElementById(
        "loaderText"
    ).textContent =
        text || "Preparing payment...";

    document.getElementById(
        "loader"
    ).classList.add(
        "show"
    );
}


function hideLoader(){

    document.getElementById(
        "loader"
    ).classList.remove(
        "show"
    );
}


function showStatus(
    text,
    type=""
){

    const box =
        document.getElementById(
            "status"
        );

    box.textContent =
        text || "";

    box.className =
        "status";

    if(type){
        box.classList.add(type);
    }
}


async function startPayment(
    selectedApp
){

    if(paymentRunning){
        return;
    }

    paymentRunning = true;

    showStatus("");


    if(
        selectedApp === "phonepe"
    ){

        showLoader(
            "Preparing PhonePe..."
        );

    }else{

        showLoader(
            "Preparing Paytm..."
        );

    }


    try{


        /* =========================
           CREATE RAZORPAY ORDER
        ========================== */

        const response =
            await fetch(

                BACKEND +
                "/create-order",

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            amount:100
                        })
                }

            );


        const data =
            await response.json();


        console.log(
            "CREATE ORDER:",
            data
        );


        if(
            !response.ok ||
            !data ||
            !data.success ||
            !data.order
        ){

            throw new Error(
                data?.message ||
                "Unable to create payment"
            );

        }


        const order =
            data.order;


        showLoader(
            "Opening UPI..."
        );


        /* =========================
           RAZORPAY CONFIG
        ========================== */

        const options = {

            key:
                RAZORPAY_KEY,

            amount:
                order.amount,

            currency:
                order.currency ||
                "INR",

            order_id:
                order.id,

            name:
                "CEZOO",

            description:
                "UPI Payment",

            webview_intent:
                true,


            /* =====================
               UPI ONLY
            ====================== */

            config:{

                display:{

                    blocks:{

                        upi:{

                            name:
                                "Pay using UPI",

                            instruments:[
                                {
                                    method:"upi"
                                }
                            ]

                        }

                    },

                    sequence:[
                        "block.upi"
                    ],

                    preferences:{
                        show_default_blocks:
                            false
                    }

                }

            },


            theme:{
                color:"#16a34a"
            },


            /* =====================
               SUCCESS
            ====================== */

            handler:
                function(
                    paymentResponse
                ){

                    hideLoader();

                    paymentRunning =
                        false;


                    console.log(
                        "PAYMENT SUCCESS:",
                        paymentResponse
                    );


                    showStatus(
                        "Payment successful ✅",
                        "success"
                    );


                    /*
                    Production lo ikkada
                    backend verify call cheyyali.

                    paymentResponse fields:

                    paymentResponse.razorpay_order_id

                    paymentResponse.razorpay_payment_id

                    paymentResponse.razorpay_signature
                    */

                },


            modal:{

                ondismiss:
                    function(){

                        hideLoader();

                        paymentRunning =
                            false;

                        showStatus(
                            "Payment cancelled"
                        );

                    }

            }

        };


        const razorpay =
            new Razorpay(
                options
            );


        razorpay.on(

            "payment.failed",

            function(response){

                hideLoader();

                paymentRunning =
                    false;


                console.error(
                    response
                );


                showStatus(

                    response?.error
                        ?.description ||

                    "Payment failed",

                    "error"

                );

            }

        );


        /* =========================
           OPEN CHECKOUT
        ========================== */

        setTimeout(
            function(){

                razorpay.open();

                setTimeout(
                    hideLoader,
                    300
                );

            },
            500
        );


    }
    catch(error){

        console.error(
            error
        );

        hideLoader();

        paymentRunning =
            false;


        showStatus(

            error.message ||
            "Unable to start payment",

            "error"

        );

    }

}

</script>

</body>
</html>
