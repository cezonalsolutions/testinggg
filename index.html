
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:'Poppins',sans-serif;
    background:#ff2380;
}

/* MAIN SCREEN */

.loginScreen{
    position:relative;

    width:100%;
    height:100vh;
    height:100dvh;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#ff2380;
}

/* HERO */

.loginHero{
    position:relative;

    width:100%;

    flex:1 1 0;
    min-height:0;

    overflow:hidden;

    background:#ff2380;

    transition:flex .35s ease,opacity .25s ease;
}

/* TEXT */

.handText{
    position:absolute;

    top:12%;
    left:0;

    width:100%;
    padding:0 15px;

    text-align:center;

    font-family:'Outfit',sans-serif;
    font-size:clamp(28px,7vw,46px);
    font-weight:400;

    letter-spacing:-.8px;
    color:white;
}

.billingText{
    position:absolute;

    top:calc(12% + 52px);
    left:0;

    width:100%;

    text-align:center;

    font-family:'Outfit',sans-serif;

    font-size:clamp(14px,3.5vw,19px);
    font-weight:400;

    letter-spacing:3px;
    text-transform:uppercase;

    color:rgba(255,255,255,.85);
}

/* IMAGE */

.productImage{
    position:absolute;

    width:85%;
    max-width:420px;
    height:52%;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    object-fit:contain;
    object-position:bottom;
}

/* LOGIN SHEET */

.loginPanel{
    position:relative;

    z-index:10;

    width:100%;

    flex:0 0 auto;

    background:white;

    border-radius:38px 38px 0 0;

    padding:30px 25px 25px;

    transition:padding .3s ease;
}

/* TITLE */

.loginTitle{
    font-family:'Outfit',sans-serif;

    font-size:25px;
    font-weight:500;

    letter-spacing:-.6px;
    line-height:1.3;

    color:#242424;
}

/* INPUT BOX */

.phoneBox{
    display:flex;
    align-items:center;

    width:100%;
    height:70px;

    margin-top:25px;

    border:1.5px solid #e4e4e4;
    border-radius:19px;

    padding:0 20px;

    background:white;
}

.countryCode{
    font-size:20px;
    font-weight:500;
    color:#444;

    padding-right:15px;
    margin-right:15px;

    border-right:1px solid #777;
}

.phoneBox input{
    flex:1;

    width:100%;
    min-width:0;
    height:100%;

    border:none;
    outline:none;

    background:transparent;

    font-family:'Poppins',sans-serif;
    font-size:18px;
    font-weight:400;

    color:#333;
}

.phoneBox input::placeholder{
    color:#999;
}

/* PASSWORD */

.passwordBox{
    display:none;
}

.passwordBox.show{
    display:flex;
}

/* BUTTON */

.proceedButton{
    width:100%;
    height:65px;

    margin-top:22px;

    border:none;
    border-radius:50px;

    background:#f1f1f1;
    color:#aaa;

    font-family:'Poppins',sans-serif;
    font-size:20px;
    font-weight:500;

    cursor:not-allowed;

    transition:background .25s,color .25s;
}

.proceedButton.active{
    background:#ff2380;
    color:white;
    cursor:pointer;
}

/* TERMS */

.terms{
    margin-top:17px;

    text-align:center;

    font-size:11px;
    line-height:1.6;

    color:#777;
}

.terms a{
    color:#333;
    text-decoration:none;
    font-weight:500;
}

/* KEYBOARD OPEN — SHEET ONLY MIDDLE */

.loginScreen.keyboardOpen .loginHero{

    flex:0 0 38%;

}

.loginScreen.keyboardOpen .productImage{

    opacity:0;
    visibility:hidden;

}

.loginScreen.keyboardOpen .loginPanel{

    flex:1 1 auto;

    border-radius:32px 32px 0 0;

    padding-top:35px;

}

/* MOBILE */

@media(max-width:480px){

    .handText{
        font-size:clamp(28px,7vw,38px);
    }

    .billingText{
        top:calc(12% + 44px);
        font-size:14px;
        letter-spacing:2.5px;
    }

    .productImage{
        width:90%;
    }

    .loginPanel{
        padding:30px 25px 24px;
    }

    .loginTitle{
        font-size:23px;
    }

    .phoneBox{
        height:65px;
        margin-top:24px;
    }

    .countryCode{
        font-size:18px;
    }

    .phoneBox input{
        font-size:16px;
    }

    .proceedButton{
        height:62px;
        margin-top:20px;
        font-size:19px;
    }

    .terms{
        font-size:10px;
    }

}

/* SHORT HEIGHT */

@media(max-height:700px){

    .loginPanel{
        padding-top:20px;
        padding-bottom:16px;
    }

    .phoneBox{
        height:55px;
        margin-top:15px;
    }

    .proceedButton{
        height:53px;
        margin-top:13px;
    }

    .terms{
        margin-top:10px;
    }

}

</style>
</head>

<body>

<div class="loginScreen" id="loginScreen">

    <!-- HERO -->

    <div class="loginHero">

        <div class="handText">
            Simple and Secure
        </div>

        <div class="billingText">
            Billing Software
        </div>

        <img
            src="torq.png"
            class="productImage"
            alt="Billing Software"
        >

    </div>

    <!-- LOGIN SHEET -->

    <div class="loginPanel">

        <div class="loginTitle" id="loginTitle">
            Login with mobile number
        </div>

        <!-- MOBILE -->

        <div class="phoneBox" id="mobileBox">

            <span class="countryCode">
                +91
            </span>

            <input
                id="mobileInput"
                type="tel"
                placeholder="Enter Mobile Number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel-national"
            >

        </div>

        <!-- PASSWORD -->

        <div class="phoneBox passwordBox" id="passwordBox">

            <input
                id="passwordInput"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password"
            >

        </div>

        <!-- BUTTON -->

        <button
            class="proceedButton"
            id="proceedButton"
            disabled
        >
            Proceed
        </button>

        <!-- TERMS -->

        <div class="terms">

            By Clicking, I accept the

            <a href="#">
                Terms & Conditions
            </a>

            &

            <a href="#">
                Privacy Policy
            </a>

        </div>

    </div>

</div>

<script>

/* ELEMENTS */

const screen = document.getElementById("loginScreen");

const mobileInput = document.getElementById("mobileInput");

const passwordInput = document.getElementById("passwordInput");

const mobileBox = document.getElementById("mobileBox");

const passwordBox = document.getElementById("passwordBox");

const loginTitle = document.getElementById("loginTitle");

const button = document.getElementById("proceedButton");

let step = "mobile";

/* BUTTON STATE */

function updateButton(){

    let valid = false;

    if(step === "mobile"){

        valid = /^[0-9]{10}$/.test(mobileInput.value);

    }else{

        valid = passwordInput.value.length > 0;

    }

    button.disabled = !valid;

    button.classList.toggle("active",valid);

}

/* MOBILE NUMBER */

mobileInput.addEventListener("input",()=>{

    mobileInput.value =
        mobileInput.value.replace(/\D/g,"").slice(0,10);

    updateButton();

});

/* PASSWORD */

passwordInput.addEventListener("input",updateButton);

/* KEYBOARD OPEN */

function openSheet(){

    screen.classList.add("keyboardOpen");

}

function closeSheet(){

    screen.classList.remove("keyboardOpen");

}

mobileInput.addEventListener("focus",openSheet);

passwordInput.addEventListener("focus",openSheet);

/* BUTTON CLICK */

button.addEventListener("click",()=>{

    if(button.disabled)return;

    if(step === "mobile"){

        step = "password";

        loginTitle.textContent = "Enter your password";

        mobileBox.style.display = "none";

        passwordBox.classList.add("show");

        button.textContent = "Login";

        updateButton();

        openSheet();

        passwordInput.focus();

    }else{

        /* CONNECT LOGIN API HERE */

        alert("Login clicked");

    }

});

/* KEYBOARD CLOSE */

document.addEventListener("focusout",()=>{

    setTimeout(()=>{

        if(
            document.activeElement !== mobileInput &&
            document.activeElement !== passwordInput
        ){

            closeSheet();

        }

    },150);

});

/* INITIAL */

updateButton();

</script>

</body>
</html>
