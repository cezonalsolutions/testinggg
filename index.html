
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:'Poppins',sans-serif;
    background:#ff2380;
}

/* MAIN SCREEN */

.loginScreen{
    position:relative;

    width:100%;
    height:100vh;
    height:100dvh;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#ff2380;
}

/* HERO SECTION */

.loginHero{
    position:relative;

    width:100%;

    flex:1 1 0;
    min-height:0;

    background:#ff2380;

    overflow:hidden;
}

/* SIMPLE AND SECURE */

.handText{
    position:absolute;

    top:12%;
    left:0;

    width:100%;
    padding:0 15px;

    text-align:center;

    font-family:'Outfit',sans-serif;
    font-style:normal;

    font-size:clamp(28px,7vw,46px);
    font-weight:400;

    letter-spacing:-0.8px;

    color:white;

    transform:none;

    z-index:2;
}

/* BILLING SOFTWARE */

.billingText{
    position:absolute;

    top:calc(12% + 52px);
    left:0;

    width:100%;

    text-align:center;

    font-family:'Outfit',sans-serif;

    font-size:clamp(14px,3.5vw,19px);
    font-weight:400;

    letter-spacing:3px;

    text-transform:uppercase;

    color:rgba(255,255,255,.85);

    z-index:2;
}

/* PRODUCT IMAGE */

.productImage{
    position:absolute;

    width:85%;
    max-width:420px;

    height:52%;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    object-fit:contain;
    object-position:bottom;

    z-index:3;
}

/* LOGIN PANEL */

.loginPanel{
    position:relative;

    z-index:10;

    width:100%;

    flex:0 0 auto;

    background:white;

    border-radius:38px 38px 0 0;

    padding:30px 25px 25px;
}

/* LOGIN TITLE — NEW FONT */

.loginTitle{
    font-family:'Outfit',sans-serif;
    font-size:25px;
    font-weight:500;
    letter-spacing:-0.6px;
    line-height:1.3;
    color:#242424;
}

/* MOBILE INPUT */

.phoneBox{
    display:flex;
    align-items:center;

    width:100%;
    height:70px;

    margin-top:25px;

    border:1.5px solid #e4e4e4;
    border-radius:19px;

    padding:0 20px;

    background:white;
}

.countryCode{
    font-size:20px;
    font-weight:500;

    color:#444;

    padding-right:15px;
    margin-right:15px;

    border-right:1px solid #777;
}

.phoneBox input{
    flex:1;

    width:100%;
    min-width:0;
    height:100%;

    border:none;
    outline:none;

    background:transparent;

    font-family:'Poppins',sans-serif;

    font-size:18px;
    font-weight:400;

    color:#333;
}

.phoneBox input::placeholder{
    color:#999;
}

/* PROCEED BUTTON */

.proceedButton{
    width:100%;
    height:65px;

    margin-top:22px;

    border:1.5px solid #e5e5e5;
    border-radius:50px;

    background:#fcfcfc;
    color:#999;

    font-family:'Poppins',sans-serif;

    font-size:20px;
    font-weight:500;

    cursor:pointer;
}

/* TERMS */

.terms{
    margin-top:17px;

    text-align:center;

    font-size:11px;
    line-height:1.6;

    color:#777;
}

.terms a{
    color:#333;
    text-decoration:none;
    font-weight:500;
}

/* MOBILE */

@media(max-width:480px){

    .handText{
        top:12%;
        font-size:clamp(28px,7vw,38px);
    }

    .billingText{
        top:calc(12% + 44px);
        font-size:14px;
        letter-spacing:2.5px;
    }

    .productImage{
        width:90%;
        height:52%;
    }

    .loginPanel{
        padding:30px 25px 24px;
    }

    .loginTitle{
        font-size:23px;
        font-weight:500;
    }

    .phoneBox{
        height:65px;
        margin-top:24px;
    }

    .countryCode{
        font-size:18px;
    }

    .phoneBox input{
        font-size:16px;
    }

    .proceedButton{
        height:62px;
        margin-top:20px;
        font-size:19px;
    }

    .terms{
        font-size:10px;
    }

}

/* SHORT HEIGHT DEVICES */

@media(max-height:700px){

    .handText{
        top:8%;
    }

    .billingText{
        top:calc(8% + 44px);
    }

    .productImage{
        height:48%;
    }

    .loginPanel{
        padding-top:20px;
        padding-bottom:16px;
    }

    .phoneBox{
        height:55px;
        margin-top:15px;
    }

    .proceedButton{
        height:53px;
        margin-top:13px;
    }

    .terms{
        margin-top:10px;
    }

}

</style>

</head>

<body>

<div class="loginScreen">

    <!-- HERO -->

    <div class="loginHero">

        <div class="handText">
            Simple and Secure
        </div>

        <div class="billingText">
            Billing Software
        </div>

        <!-- PRODUCT IMAGE -->

        <img
            src="torq.png"
            class="productImage"
            alt="Billing Software"
        >

    </div>

    <!-- LOGIN PANEL -->

    <div class="loginPanel">

        <div class="loginTitle">
            Login with mobile number
        </div>

        <!-- PHONE NUMBER -->

        <div class="phoneBox">

            <span class="countryCode">
                +91
            </span>

            <input
                type="tel"
                placeholder="Enter Mobile Number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel-national"
            >

        </div>

        <!-- PROCEED -->

        <button class="proceedButton">
            Proceed
        </button>

        <!-- TERMS -->

        <div class="terms">

            By Clicking, I accept the

            <a href="#">
                Terms & Conditions
            </a>

            &

            <a href="#">
                Privacy Policy
            </a>

        </div>

    </div>

</div>

</body>
</html>
