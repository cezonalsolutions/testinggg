<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Café</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
}

body{
  background:#fff;
}


/* =========================
   BANNER
========================= */

.banner{
  width:100%;
  height:175px;
  position:relative;
  overflow:hidden;

  background:#7b12df;

  border-radius:
    0 0 50% 50% /
    0 0 28px 28px;
}


/* =========================
   STATIC LIGHTS
========================= */

.cafeLights{
  position:absolute;
  top:0;
  width:155px;
  height:70px;
  z-index:2;
  pointer-events:none;
}

.cafeLights.left{
  left:0;
}

.cafeLights.right{
  right:0;
}


/* WIRE */

.wire{
  position:absolute;
  top:-18px;

  width:165px;
  height:57px;

  border-bottom:2px solid rgba(34,20,45,.72);
}

.left .wire{
  left:-15px;
  border-radius:0 0 85% 0;
  transform:rotate(2deg);
}

.right .wire{
  right:-15px;
  border-radius:0 0 0 85%;
  transform:rotate(-2deg);
}


/* LIGHT STEM */

.light{
  position:absolute;
  width:2px;
  background:rgba(40,24,48,.75);
}


/* BULB CAP */

.light::before{
  content:"";

  position:absolute;
  left:50%;
  bottom:-3px;

  width:7px;
  height:5px;

  transform:translateX(-50%);

  background:#33263b;

  border-radius:2px 2px 1px 1px;
}


/* BULB */

.light::after{
  content:"";

  position:absolute;
  left:50%;
  bottom:-13px;

  width:10px;
  height:12px;

  transform:translateX(-50%);

  background:#ffd85a;

  border-radius:50% 50% 55% 55%;

  box-shadow:
    0 0 5px rgba(255,216,90,.95),
    0 0 11px rgba(255,190,55,.55);
}


/* LEFT LIGHTS */

.left .l1{
  left:12px;
  top:3px;
  height:9px;
}

.left .l2{
  left:43px;
  top:8px;
  height:14px;
}

.left .l3{
  left:76px;
  top:14px;
  height:18px;
}

.left .l4{
  left:111px;
  top:20px;
  height:20px;
}

.left .l5{
  left:143px;
  top:24px;
  height:19px;
}


/* RIGHT LIGHTS */

.right .l1{
  right:12px;
  top:3px;
  height:9px;
}

.right .l2{
  right:43px;
  top:8px;
  height:14px;
}

.right .l3{
  right:76px;
  top:14px;
  height:18px;
}

.right .l4{
  right:111px;
  top:20px;
  height:20px;
}

.right .l5{
  right:143px;
  top:24px;
  height:19px;
}


/* =========================
   MOVING GROUP
========================= */

.cafeMover{
  position:absolute;

  left:0;
  top:50%;

  width:100px;
  height:100px;

  z-index:5;

  /*
    0-40% slow
    after 40% speed increases
  */
  animation:
    cafeBikeMove 8s linear infinite;

  will-change:transform;
}


/* =========================
   BIKE IMAGE
========================= */

.cafeImage{
  position:absolute;

  width:90px;
  height:90px;

  left:5px;
  top:5px;

  object-fit:contain;

  z-index:3;

  /* tiny real bike feel */
  animation:
    bikeRide .8s ease-in-out infinite;
}


@keyframes bikeRide{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-1px);
  }

}


/* =========================
   SPEED WAVES
========================= */

.speedWaves{
  position:absolute;

  right:74px;
  top:50%;

  width:82px;
  height:56px;

  transform:translateY(-50%);

  z-index:1;
}


.wave{
  position:absolute;

  right:0;

  height:2px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.18),
    rgba(255,255,255,.75)
  );

  border-radius:50px;

  animation:
    speedTrail 1.1s ease-out infinite;
}


.wave1{
  width:42px;
  top:8px;
}

.wave2{
  width:62px;
  top:21px;
  animation-delay:.12s;
}

.wave3{
  width:50px;
  top:34px;
  animation-delay:.24s;
}

.wave4{
  width:30px;
  top:46px;
  animation-delay:.36s;
}


@keyframes speedTrail{

  0%{
    transform:
      translateX(8px)
      scaleX(.55);

    opacity:0;
  }

  35%{
    opacity:.75;
  }

  70%{
    transform:
      translateX(-3px)
      scaleX(1);

    opacity:.65;
  }

  100%{
    transform:
      translateX(-12px)
      scaleX(1.08);

    opacity:0;
  }

}


/* ==========================================
   BIKE MOVEMENT

   0-10%  = ENTRY
   10-40% = SLOW + SMOOTH
   40-60% = SPEED PICKUP
   60-100% = FAST EXIT
========================================== */

@keyframes cafeBikeMove{


  /* START OUTSIDE */

  0%{
    transform:
      translate(-130px,4px)
      rotate(-1deg);
  }


  /* ENTRY */

  10%{
    transform:
      translate(1vw,1px)
      rotate(-.5deg);
  }


  /* =====================
     SLOW MOTION START
  ===================== */

  15%{
    transform:
      translate(5vw,0px)
      rotate(-.3deg);
  }


  20%{
    transform:
      translate(9vw,-1px)
      rotate(0deg);
  }


  25%{
    transform:
      translate(13vw,-2px)
      rotate(.1deg);
  }


  30%{
    transform:
      translate(17vw,-3px)
      rotate(.2deg);
  }


  35%{
    transform:
      translate(21vw,-4px)
      rotate(.2deg);
  }


  /* 40% SLOW SECTION END */

  40%{
    transform:
      translate(25vw,-5px)
      rotate(.3deg);
  }


  /* =====================
     SPEED STARTS PICKING UP
  ===================== */

  45%{
    transform:
      translate(31vw,-6px)
      rotate(.3deg);
  }


  50%{
    transform:
      translate(39vw,-7px)
      rotate(.2deg);
  }


  /* FAST */

  55%{
    transform:
      translate(49vw,-8px)
      rotate(0deg);
  }


  60%{
    transform:
      translate(60vw,-7px)
      rotate(-.2deg);
  }


  68%{
    transform:
      translate(72vw,-5px)
      rotate(-.3deg);
  }


  76%{
    transform:
      translate(83vw,-3px)
      rotate(0deg);
  }


  84%{
    transform:
      translate(93vw,-1px)
      rotate(.3deg);
  }


  92%{
    transform:
      translate(105vw,1px)
      rotate(.5deg);
  }


  /* FAST EXIT */

  100%{
    transform:
      translate(calc(100vw + 150px),3px)
      rotate(.7deg);
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .banner{
    height:155px;

    border-radius:
      0 0 50% 50% /
      0 0 22px 22px;
  }


  /* LIGHTS */

  .cafeLights{
    width:115px;
    height:60px;
  }

  .wire{
    width:125px;
    height:48px;
  }


  .left .l1{left:8px;}
  .left .l2{left:31px;}
  .left .l3{left:56px;}
  .left .l4{left:82px;}
  .left .l5{left:108px;}

  .right .l1{right:8px;}
  .right .l2{right:31px;}
  .right .l3{right:56px;}
  .right .l4{right:82px;}
  .right .l5{right:108px;}


  .light::after{
    width:8px;
    height:10px;
  }


  /* BIKE */

  .cafeMover{
    width:85px;
    height:85px;
  }

  .cafeImage{
    width:75px;
    height:75px;
  }


  /* WAVES */

  .speedWaves{
    right:61px;
    width:62px;
    height:48px;
  }

  .wave1{
    width:32px;
  }

  .wave2{
    width:48px;
  }

  .wave3{
    width:39px;
  }

  .wave4{
    width:25px;
  }

}


@media(max-width:390px){

  .banner{
    height:145px;
  }

}

</style>
</head>


<body>

<section class="banner">


  <!-- LEFT LIGHTS -->

  <div class="cafeLights left">

    <div class="wire"></div>

    <span class="light l1"></span>
    <span class="light l2"></span>
    <span class="light l3"></span>
    <span class="light l4"></span>
    <span class="light l5"></span>

  </div>


  <!-- RIGHT LIGHTS -->

  <div class="cafeLights right">

    <div class="wire"></div>

    <span class="light l1"></span>
    <span class="light l2"></span>
    <span class="light l3"></span>
    <span class="light l4"></span>
    <span class="light l5"></span>

  </div>


  <!-- MOVING BIKE -->

  <div class="cafeMover">


    <!-- SPEED WAVES -->

    <div class="speedWaves">

      <span class="wave wave1"></span>
      <span class="wave wave2"></span>
      <span class="wave wave3"></span>
      <span class="wave wave4"></span>

    </div>


    <!-- BIKE -->

    <img
      src="BIKE.webp"
      class="cafeImage"
      alt=""
    >


  </div>


</section>

</body>
</html>
