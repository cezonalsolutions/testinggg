<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO UPI</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f6f7f7;
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:390px;
    background:#fff;
    border-radius:22px;
    padding:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    color:#16a34a;
}

.amount{
    margin-top:24px;
    padding:20px;
    background:#f1fff6;
    border-radius:16px;
    text-align:center;
}

.amount small{
    display:block;
    color:#777;
    margin-bottom:5px;
}

.amount strong{
    font-size:40px;
}

.title{
    margin-top:22px;
    font-size:13px;
    font-weight:800;
}

.pay-btn{
    width:100%;
    height:58px;
    margin-top:11px;
    border:0;
    border-radius:14px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.phonepe{
    background:#5f259f;
    color:white;
}

.paytm{
    background:#00baf2;
    color:white;
}

.loader{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.97);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999999;
}

.loader.show{
    display:flex;
}

.loader-box{
    text-align:center;
}

.spinner{
    width:45px;
    height:45px;
    margin:auto;
    border-radius:50%;
    border:4px solid #ddd;
    border-top-color:#16a34a;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loader-text{
    margin-top:14px;
    font-size:14px;
    font-weight:800;
}

.status{
    min-height:20px;
    margin-top:15px;
    text-align:center;
    font-size:12px;
}

.error{
    color:#dc2626;
}

.success{
    color:#16a34a;
    font-weight:800;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        CEZOO
    </div>

    <div class="amount">

        <small>
            Amount to Pay
        </small>

        <strong>
            ₹1
        </strong>

    </div>

    <div class="title">
        Select UPI App
    </div>

    <button
        class="pay-btn phonepe"
        onclick="startUPIPayment('phonepe')"
    >
        Pay with PhonePe
    </button>

    <button
        class="pay-btn paytm"
        onclick="startUPIPayment('paytm')"
    >
        Pay with Paytm
    </button>

    <div
        id="status"
        class="status"
    ></div>

</div>


<div
    id="loader"
    class="loader"
>

    <div class="loader-box">

        <div class="spinner"></div>

        <div
            id="loaderText"
            class="loader-text"
        >
            Preparing payment...
        </div>

    </div>

</div>


<script>

const BACKEND =
    "https://razropay.onrender.com";

const RAZORPAY_KEY =
    "rzp_live_SqrUSaPO5pA6gt";

let paymentRunning = false;

let selectedApp = "";


function showLoader(text){

    document.getElementById(
        "loaderText"
    ).textContent = text;

    document.getElementById(
        "loader"
    ).classList.add(
        "show"
    );
}


function hideLoader(){

    document.getElementById(
        "loader"
    ).classList.remove(
        "show"
    );
}


function showStatus(
    text,
    type=""
){

    const box =
        document.getElementById(
            "status"
        );

    box.textContent = text;

    box.className =
        "status " + type;
}


async function startUPIPayment(app){

    if(paymentRunning){
        return;
    }

    paymentRunning = true;

    selectedApp = app;

    showStatus("");

    if(app === "phonepe"){

        showLoader(
            "Preparing PhonePe..."
        );

    }else{

        showLoader(
            "Preparing Paytm..."
        );

    }


    try{

        const response =
            await fetch(
                BACKEND +
                "/create-order",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            amount:100
                        })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data?.success ||
            !data?.order
        ){

            throw new Error(
                data?.message ||
                "Unable to create payment"
            );

        }


        const order =
            data.order;


        const options = {

            key:
                RAZORPAY_KEY,

            amount:
                order.amount,

            currency:
                order.currency ||
                "INR",

            order_id:
                order.id,

            name:
                "CEZOO",

            description:
                app === "phonepe"
                ? "PhonePe UPI Payment"
                : "Paytm UPI Payment",

            webview_intent:
                true,

            config:{

                display:{

                    blocks:{

                        upi:{

                            name:
                                app === "phonepe"
                                ? "Continue with PhonePe"
                                : "Continue with Paytm",

                            instruments:[
                                {
                                    method:"upi"
                                }
                            ]

                        }

                    },

                    sequence:[
                        "block.upi"
                    ],

                    preferences:{
                        show_default_blocks:false
                    }

                }

            },

            theme:{
                color:"#16a34a"
            },

            handler:function(
                paymentResponse
            ){

                paymentRunning = false;

                hideLoader();

                console.log(
                    "SUCCESS:",
                    paymentResponse
                );

                showStatus(
                    "Payment successful ✅",
                    "success"
                );

            },

            modal:{

                ondismiss:function(){

                    paymentRunning = false;

                    hideLoader();

                    showStatus(
                        "Payment cancelled"
                    );

                }

            }

        };


        const razorpay =
            new Razorpay(
                options
            );


        razorpay.on(
            "payment.failed",
            function(response){

                paymentRunning = false;

                hideLoader();

                showStatus(
                    response?.error
                        ?.description ||
                    "Payment failed",
                    "error"
                );

            }
        );


        showLoader(
            app === "phonepe"
            ? "Opening PhonePe..."
            : "Opening Paytm..."
        );


        setTimeout(
            function(){

                razorpay.open();

                setTimeout(
                    hideLoader,
                    300
                );

            },
            400
        );


    }catch(error){

        paymentRunning = false;

        hideLoader();

        showStatus(
            error.message ||
            "Unable to start payment",
            "error"
        );

    }

}

</script>

</body>
</html>
