<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CEZOO ₹1 UPI</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7f6;
  font-family:Arial,sans-serif;
}

.card{
  width:92%;
  max-width:390px;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h2{
  margin-bottom:8px;
}

.amount{
  font-size:42px;
  font-weight:800;
  text-align:center;
  margin:25px 0;
}

input{
  width:100%;
  height:52px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

#payBtn{
  width:100%;
  height:54px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:700;
}

.apps{
  display:none;
  margin-top:22px;
}

.apps.show{
  display:block;
}

.app{
  width:100%;
  height:56px;
  margin-top:10px;
  border:1px solid #e5e5e5;
  border-radius:14px;
  background:white;
  font-size:16px;
  font-weight:700;
}

.status{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.spinner{
  width:26px;
  height:26px;
  margin:14px auto 0;
  border:3px solid #ddd;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:none;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="card">

  <h2>CEZOO Payment</h2>

  <div class="amount">₹1</div>

  <input
    id="mobile"
    type="tel"
    maxlength="10"
    placeholder="Enter mobile number"
  >

  <button id="payBtn">
    Pay ₹1
  </button>

  <div id="apps" class="apps">

    <button class="app" onclick="payUPI()">
      Google Pay
    </button>

    <button class="app" onclick="payUPI()">
      PhonePe
    </button>

    <button class="app" onclick="payUPI()">
      Paytm
    </button>

  </div>

  <div id="spinner" class="spinner"></div>

  <div id="status" class="status"></div>

</div>


<script>

const BACKEND =
  "https://razropay.onrender.com";

const KEY =
  "rzp_live_SqrUSaPO5pA6gt";

let order = null;
let mobile = "";


/* ===========================
   CREATE ₹1 ORDER
=========================== */

document
.getElementById("payBtn")
.addEventListener(
  "click",
  async function(){

    mobile =
      document
      .getElementById("mobile")
      .value
      .trim();

    if(
      !/^[6-9][0-9]{9}$/.test(mobile)
    ){
      alert("Enter valid mobile number");
      return;
    }

    setStatus("Creating payment...");

    try{

      const r =
        await fetch(
          BACKEND + "/create-order",
          {
            method:"POST",

            headers:{
              "Content-Type":
              "application/json"
            },

            body:JSON.stringify({
              amount:100
            })
          }
        );

      const data =
        await r.json();

      if(
        !data.success ||
        !data.order?.id
      ){
        throw new Error(
          data.message ||
          "Order creation failed"
        );
      }

      order =
        data.order;

      document
      .getElementById("apps")
      .classList
      .add("show");

      setStatus(
        "Choose UPI app"
      );

    }
    catch(error){

      console.error(error);

      setStatus(
        error.message
      );

    }

  }
);


/* ===========================
   START UPI INTENT
=========================== */

function payUPI(){

  if(!order){
    return;
  }

  showSpinner(true);

  setStatus(
    "Opening UPI..."
  );


  const options = {

    key:KEY,

    amount:
      order.amount,

    currency:
      order.currency,

    order_id:
      order.id,

    name:
      "CEZOO",

    description:
      "₹1 Payment",

    prefill:{
      contact:
        "+91" + mobile
    },

    method:{
      upi:true
    },

    config:{

      display:{

        blocks:{

          upi:{

            name:
              "UPI",

            instruments:[
              {
                method:"upi"
              }
            ]

          }

        },

        sequence:[
          "block.upi"
        ],

        preferences:{
          show_default_blocks:false
        }

      }

    },

    handler:
      async function(response){

        showSpinner(true);

        setStatus(
          "Verifying payment..."
        );

        await verifyPayment(
          response
        );

      },

    modal:{

      ondismiss:function(){

        showSpinner(false);

        setStatus(
          "Payment cancelled"
        );

      }

    }

  };


  const rzp =
    new Razorpay(options);


  rzp.on(
    "payment.failed",
    function(response){

      console.log(
        response.error
      );

      showSpinner(false);

      setStatus(
        "Payment failed"
      );

    }
  );


  rzp.open();

}


/* ===========================
   VERIFY
=========================== */

async function verifyPayment(response){

  try{

    const r =
      await fetch(
        BACKEND +
        "/verify-payment",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            razorpay_order_id:
              response
              .razorpay_order_id,

            razorpay_payment_id:
              response
              .razorpay_payment_id,

            razorpay_signature:
              response
              .razorpay_signature

          })

        }
      );


    const data =
      await r.json();


    showSpinner(false);


    if(
      data.success &&
      data.paid &&
      data.status ===
      "captured"
    ){

      setStatus(
        "✅ ₹1 Payment Successful"
      );

    }
    else{

      setStatus(
        "Payment verification pending"
      );

    }

  }
  catch(error){

    console.error(error);

    showSpinner(false);

    setStatus(
      "Verification error"
    );

  }

}


/* ===========================
   HELPERS
=========================== */

function setStatus(text){

  document
  .getElementById("status")
  .innerText =
    text;

}

function showSpinner(show){

  document
  .getElementById("spinner")
  .style
  .display =
    show
    ? "block"
    : "none";

}

</script>

</body>
</html>
