<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Cashfree Payment</title>

<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#f4f8f5;
  font-family:Arial,Helvetica,sans-serif;
}

.payment-card{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:24px;
  padding:28px 22px 24px;
  box-shadow:0 18px 50px rgba(0,0,0,.08);
}

.brand{
  text-align:center;
}

.brand-name{
  font-size:30px;
  font-weight:900;
  color:#16a34a;
  letter-spacing:1px;
}

.subtitle{
  margin-top:5px;
  font-size:14px;
  color:#777;
}

.amount-box{
  margin-top:26px;
  text-align:center;
  padding:22px;
  border-radius:18px;
  background:#f4fff7;
  border:1px solid #dcfce7;
}

.amount-label{
  font-size:13px;
  color:#6b7280;
}

.amount{
  margin-top:5px;
  font-size:46px;
  font-weight:900;
  color:#111;
}

.test-badge{
  display:inline-block;
  margin-top:10px;
  padding:5px 10px;
  border-radius:50px;
  background:#dcfce7;
  color:#15803d;
  font-size:11px;
  font-weight:700;
}

.form{
  margin-top:24px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:13px;
  font-weight:700;
  color:#333;
}

.mobile-box{
  display:flex;
  align-items:center;
  height:56px;
  border:1.5px solid #ddd;
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.mobile-box:focus-within{
  border-color:#16a34a;
  box-shadow:0 0 0 4px rgba(22,163,74,.08);
}

.country{
  height:100%;
  display:flex;
  align-items:center;
  padding:0 13px;
  border-right:1px solid #eee;
  font-weight:700;
}

input{
  flex:1;
  height:100%;
  border:none;
  outline:none;
  padding:0 14px;
  font-size:16px;
}

.pay-btn{
  width:100%;
  height:56px;
  margin-top:18px;
  border:none;
  border-radius:14px;
  background:#16a34a;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

.pay-btn:active{
  transform:scale(.98);
}

.pay-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.loader-wrap{
  display:none;
  margin-top:18px;
  text-align:center;
}

.loader-wrap.show{
  display:block;
}

.spinner{
  width:30px;
  height:30px;
  margin:auto;
  border-radius:50%;
  border:3px solid #e5e7eb;
  border-top-color:#16a34a;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#status{
  margin-top:13px;
  min-height:20px;
  text-align:center;
  font-size:13px;
  color:#666;
  line-height:1.5;
}

.secure{
  margin-top:22px;
  padding-top:17px;
  border-top:1px solid #eee;
  text-align:center;
  font-size:12px;
  color:#888;
}

@media(max-width:420px){
  body{
    padding:12px;
  }

  .payment-card{
    padding:24px 18px;
  }
}
</style>
</head>

<body>

<div class="payment-card">

  <div class="brand">
    <div class="brand-name">CEZOO</div>
    <div class="subtitle">Secure UPI Payment</div>
  </div>

  <div class="amount-box">

    <div class="amount-label">
      Amount to Pay
    </div>

    <div class="amount">
      ₹1
    </div>

    <div class="test-badge">
      SANDBOX TEST
    </div>

  </div>

  <div class="form">

    <label>
      Mobile Number
    </label>

    <div class="mobile-box">

      <div class="country">
        +91
      </div>

      <input
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        autocomplete="tel"
        placeholder="Enter 10 digit number"
      >

    </div>

    <button
      id="payBtn"
      class="pay-btn"
    >
      Pay ₹1
    </button>

  </div>

  <div
    id="loaderWrap"
    class="loader-wrap"
  >
    <div class="spinner"></div>
  </div>

  <div id="status"></div>

  <div class="secure">
    Secure payment powered by Cashfree
  </div>

</div>


<script>

/* =========================================
   BACKEND
========================================= */

const BACKEND =
  "https://cashfreebackend-sxcz.onrender.com";


/* =========================================
   CASHFREE

   IMPORTANT:

   Backend sandbox:
   mode:"sandbox"

   Backend production:
   mode:"production"
========================================= */

const cashfree =
  Cashfree({
    mode:"sandbox"
  });


/* =========================================
   ELEMENTS
========================================= */

const mobileInput =
  document.getElementById("mobile");

const payBtn =
  document.getElementById("payBtn");

const statusBox =
  document.getElementById("status");

const loaderWrap =
  document.getElementById("loaderWrap");


/* =========================================
   MOBILE ONLY NUMBERS
========================================= */

mobileInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value
      .replace(/\D/g,"")
      .slice(0,10);

  }
);


/* =========================================
   STATUS
========================================= */

function setStatus(message){

  statusBox.textContent =
    message || "";

}


/* =========================================
   LOADING
========================================= */

function loading(show){

  if(show){

    loaderWrap.classList.add(
      "show"
    );

    payBtn.disabled =
      true;

    payBtn.textContent =
      "Please wait...";

  }
  else{

    loaderWrap.classList.remove(
      "show"
    );

    payBtn.disabled =
      false;

    payBtn.textContent =
      "Pay ₹1";

  }

}


/* =========================================
   CREATE ORDER + OPEN CASHFREE
========================================= */

payBtn.addEventListener(
  "click",

  async function(){

    const mobile =
      mobileInput
      .value
      .replace(/\D/g,"")
      .trim();


    /* MOBILE CHECK */

    if(
      !/^[6-9]\d{9}$/.test(mobile)
    ){

      setStatus(
        "Please enter a valid 10 digit mobile number"
      );

      mobileInput.focus();

      return;

    }


    loading(true);

    setStatus(
      "Creating payment..."
    );


    try{


      /* ==================================
         CALL BACKEND
      ================================== */

      const response =
        await fetch(

          BACKEND +
          "/create-order",

          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                amount:1,

                mobile:
                  mobile,

                customer_phone:
                  mobile

              })

          }

        );


      let data;


      try{

        data =
          await response.json();

      }
      catch(error){

        throw new Error(
          "Invalid response from server"
        );

      }


      console.log(
        "CREATE ORDER RESPONSE:",
        data
      );


      /* ==================================
         BACKEND ERROR
      ================================== */

      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(

          data.message ||

          "Unable to create payment"

        );

      }


      /* ==================================
         GET SESSION ID
      ================================== */

      const paymentSessionId =

        data.payment_session_id ||

        data.order
          ?.payment_session_id;


      if(
        !paymentSessionId
      ){

        throw new Error(
          "Payment session ID not received"
        );

      }


      console.log(
        "ORDER ID:",
        data.order_id
      );


      console.log(
        "PAYMENT SESSION:",
        paymentSessionId
      );


      setStatus(
        "Opening Cashfree payment..."
      );


      /* ==================================
         CASHFREE CHECKOUT
      ================================== */

      const result =
        await cashfree.checkout({

          paymentSessionId:
            paymentSessionId,

          redirectTarget:
            "_self"

        });


      console.log(
        "CASHFREE RESULT:",
        result
      );


      /*
        Normally _self redirects away.

        If SDK returns an error without redirect:
      */

      if(
        result?.error
      ){

        throw new Error(

          result.error.message ||

          "Unable to open payment"

        );

      }


    }
    catch(error){

      console.error(
        "PAYMENT ERROR:",
        error
      );

      loading(false);

      setStatus(
        error.message ||
        "Unable to start payment"
      );

    }

  }
);

</script>

</body>
</html>
