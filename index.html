<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CEZOO UPI Pay</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7f5;
  font-family:Arial,sans-serif;
}

.card{
  width:92%;
  max-width:390px;
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 15px 45px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  color:#16a34a;
  margin-bottom:25px;
}

.amount{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-bottom:25px;
}

.pay-btn{
  width:100%;
  height:58px;
  border:none;
  border-radius:15px;
  margin-top:12px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.phonepe{
  background:#5f259f;
  color:white;
}

.paytm{
  background:#00baf2;
  color:white;
}

.loading{
  display:none;
  text-align:center;
  margin-top:22px;
}

.loading.show{
  display:block;
}

.spinner{
  width:35px;
  height:35px;
  margin:auto;
  border-radius:50%;
  border:4px solid #ddd;
  border-top-color:#16a34a;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.status{
  margin-top:15px;
  text-align:center;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

  <h1>CEZOO</h1>

  <div class="amount">
    ₹1
  </div>

  <button
    class="pay-btn phonepe"
    onclick="startPayment('phonepe')">
    Pay with PhonePe
  </button>

  <button
    class="pay-btn paytm"
    onclick="startPayment('paytm')">
    Pay with Paytm
  </button>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div style="margin-top:10px">
      Opening UPI payment...
    </div>
  </div>

  <div id="status" class="status"></div>

</div>


<script>

/* ==============================
   YOUR RAZORPAY BACKEND
============================== */

const BACKEND =
  "https://YOUR-RAZORPAY-BACKEND.onrender.com";


/* ==============================
   UI
============================== */

function showLoader(){

  document
    .getElementById("loading")
    .classList
    .add("show");

}

function hideLoader(){

  document
    .getElementById("loading")
    .classList
    .remove("show");

}

function status(msg){

  document.getElementById("status")
    .textContent = msg || "";

}


/* ==============================
   START PAYMENT
============================== */

async function startPayment(app){

  showLoader();

  status(
    app === "phonepe"
      ? "Preparing PhonePe payment..."
      : "Preparing Paytm payment..."
  );

  try{


    /* CREATE RAZORPAY ORDER */

    const response =
      await fetch(
        BACKEND + "/create-order",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            amount:1
          })
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Unable to create order"
      );

    }


    /* ==============================
       RAZORPAY OPTIONS
    ============================== */

    const options = {

      key:data.key_id,

      amount:data.amount,

      currency:"INR",

      name:"CEZOO",

      description:
        app === "phonepe"
          ? "PhonePe Payment"
          : "Paytm Payment",

      order_id:data.order_id,


      /* ============================
         UPI ONLY
      ============================ */

      config:{

        display:{

          blocks:{

            upi:{

              name:"Pay using UPI",

              instruments:[
                {
                  method:"upi"
                }
              ]

            }

          },

          sequence:[
            "block.upi"
          ],

          preferences:{
            show_default_blocks:false
          }

        }

      },


      /* ============================
         PAYMENT SUCCESS
      ============================ */

      handler:async function(response){

        status(
          "Verifying payment..."
        );


        try{

          const verify =
            await fetch(
              BACKEND + "/verify-payment",
              {
                method:"POST",

                headers:{
                  "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                  razorpay_order_id:
                    response.razorpay_order_id,

                  razorpay_payment_id:
                    response.razorpay_payment_id,

                  razorpay_signature:
                    response.razorpay_signature

                })

              }
            );


          const verifyData =
            await verify.json();


          hideLoader();


          if(
            verify.ok &&
            verifyData.success
          ){

            status(
              "Payment successful ✅"
            );

          }
          else{

            status(
              "Payment verification failed"
            );

          }

        }
        catch(error){

          hideLoader();

          status(
            "Unable to verify payment"
          );

        }

      },


      modal:{

        ondismiss:function(){

          hideLoader();

          status(
            "Payment cancelled"
          );

        }

      },


      theme:{
        color:"#16a34a"
      }

    };


    /* ==============================
       OPEN RAZORPAY
    ============================== */

    const razorpay =
      new Razorpay(options);


    razorpay.on(
      "payment.failed",
      function(response){

        hideLoader();

        status(
          response.error.description ||
          "Payment failed"
        );

      }
    );


    /*
       Spinner stays visible until
       Razorpay opens.
    */

    setTimeout(
      function(){

        razorpay.open();

        hideLoader();

      },
      500
    );


  }
  catch(error){

    console.error(error);

    hideLoader();

    status(
      error.message ||
      "Unable to start payment"
    );

  }

}

</script>

</body>
</html>
