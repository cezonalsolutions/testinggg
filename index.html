<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO ₹1 UPI Test</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7f6;
  font-family:Arial, sans-serif;
}

.card{
  width:92%;
  max-width:380px;
  background:white;
  padding:28px 22px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
  font-size:24px;
  margin-bottom:8px;
}

.sub{
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.amount{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:25px;
}

input{
  width:100%;
  height:52px;
  padding:0 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:16px;
  outline:none;
}

input:focus{
  border-color:#16a34a;
}

button{
  width:100%;
  height:54px;
  border:0;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#status{
  margin-top:16px;
  text-align:center;
  font-size:14px;
  min-height:20px;
}
</style>
</head>

<body>

<div class="card">

  <h1>CEZOO Payment</h1>

  <div class="sub">
    UPI payment test
  </div>

  <div class="amount">
    ₹1
  </div>

  <input
    id="mobile"
    type="tel"
    maxlength="10"
    placeholder="Enter mobile number"
  >

  <button id="payBtn">
    Pay ₹1
  </button>

  <div id="status"></div>

</div>

<script>

const BACKEND_URL =
  "https://razropay.onrender.com";

const RAZORPAY_KEY =
  "rzp_live_SqrUSaPO5pA6gt";

const payBtn =
  document.getElementById("payBtn");

const statusBox =
  document.getElementById("status");


function setStatus(message){

  statusBox.textContent = message;

}


async function verifyPayment(response){

  setStatus("Verifying payment...");

  try{

    const verifyResponse =
      await fetch(
        BACKEND_URL + "/verify-payment",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            razorpay_order_id:
              response.razorpay_order_id,

            razorpay_payment_id:
              response.razorpay_payment_id,

            razorpay_signature:
              response.razorpay_signature

          })

        }
      );


    const verifyData =
      await verifyResponse.json();


    if(
      verifyData.success &&
      verifyData.verified &&
      verifyData.paid
    ){

      setStatus(
        "✅ ₹1 Payment Successful"
      );

      alert(
        "Payment successful"
      );

    }
    else{

      console.log(
        verifyData
      );

      setStatus(
        "Payment verification failed"
      );

    }

  }
  catch(error){

    console.error(error);

    setStatus(
      "Verification error"
    );

  }

}



payBtn.addEventListener(
  "click",
  async function(){

    const mobile =
      document
        .getElementById("mobile")
        .value
        .trim();


    if(
      !/^[6-9][0-9]{9}$/.test(mobile)
    ){

      alert(
        "Enter valid 10 digit mobile number"
      );

      return;

    }


    payBtn.disabled = true;

    setStatus(
      "Creating ₹1 payment..."
    );


    try{

      const response =
        await fetch(
          BACKEND_URL + "/create-order",
          {

            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({
              amount:100
            })

          }
        );


      const data =
        await response.json();


      console.log(
        "ORDER RESPONSE",
        data
      );


      if(
        !response.ok ||
        !data.success ||
        !data.order ||
        !data.order.id
      ){

        throw new Error(
          data.message ||
          "Unable to create order"
        );

      }


      setStatus(
        "Opening UPI payment..."
      );


      const options = {

        key:
          RAZORPAY_KEY,

        amount:
          data.order.amount,

        currency:
          data.order.currency || "INR",

        order_id:
          data.order.id,

        name:
          "CEZOO",

        description:
          "₹1 UPI Test Payment",

        prefill:{

          contact:
            mobile

        },


        config:{

          display:{

            blocks:{

              upi:{

                name:
                  "Pay using UPI",

                instruments:[

                  {
                    method:"upi"
                  }

                ]

              }

            },


            sequence:[

              "block.upi"

            ],


            preferences:{

              show_default_blocks:
                false

            }

          }

        },


        handler:
          async function(
            paymentResponse
          ){

            console.log(
              "PAYMENT RESPONSE",
              paymentResponse
            );

            await verifyPayment(
              paymentResponse
            );

          },


        modal:{

          ondismiss:
            function(){

              setStatus(
                "Payment cancelled"
              );

              payBtn.disabled =
                false;

            }

        },


        theme:{

          color:
            "#16a34a"

        }

      };


      const razorpay =
        new Razorpay(options);


      razorpay.on(
        "payment.failed",
        function(response){

          console.error(
            "PAYMENT FAILED",
            response.error
          );

          setStatus(
            "❌ Payment failed"
          );

          payBtn.disabled =
            false;

        }
      );


      razorpay.open();


    }
    catch(error){

      console.error(error);

      setStatus(
        error.message ||
        "Something went wrong"
      );

      payBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
