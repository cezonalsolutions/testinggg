<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Cashfree ₹1 Test</title>

<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f6f7f8;
  font-family:Arial,Helvetica,sans-serif;
}

.card{
  width:92%;
  max-width:390px;
  background:#fff;
  padding:26px 22px;
  border-radius:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

h2{
  margin-bottom:6px;
}

.sub{
  font-size:14px;
  color:#777;
  margin-bottom:22px;
}

.amount{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:24px;
}

input{
  width:100%;
  height:52px;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
  margin-bottom:14px;
}

button{
  width:100%;
  height:54px;
  border:0;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.spinner{
  width:28px;
  height:28px;
  margin:16px auto 0;
  border:3px solid #ddd;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:none;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#status{
  margin-top:14px;
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <h2>CEZOO Payment</h2>

  <div class="sub">
    Cashfree live payment test
  </div>

  <div class="amount">
    ₹1
  </div>

  <input
    id="mobile"
    type="tel"
    maxlength="10"
    placeholder="Enter mobile number"
  >

  <button id="payBtn">
    Pay ₹1
  </button>

  <div id="spinner" class="spinner"></div>

  <div id="status"></div>

</div>


<script>

const BACKEND =
  "https://cashfreebackend-sxcz.onrender.com";


const cashfree =
  Cashfree({
    mode:"production"
  });


const payBtn =
  document.getElementById("payBtn");

const statusBox =
  document.getElementById("status");

const spinner =
  document.getElementById("spinner");


function setStatus(text){

  statusBox.textContent = text;

}


function loading(show){

  spinner.style.display =
    show ? "block" : "none";

  payBtn.disabled = show;

}


/* ============================
   PAY BUTTON
============================ */

payBtn.addEventListener(
  "click",
  async function(){

    const mobile =
      document
      .getElementById("mobile")
      .value
      .trim();


    if(
      !/^[6-9][0-9]{9}$/.test(mobile)
    ){

      alert(
        "Enter valid 10 digit mobile number"
      );

      return;

    }


    loading(true);

    setStatus(
      "Creating ₹1 order..."
    );


    try{

      const response =
        await fetch(
          BACKEND + "/create-order",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              amount:1,

              customer_phone:
                mobile

            })

          }
        );


      const data =
        await response.json();


      console.log(
        "CREATE ORDER RESPONSE:",
        data
      );


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.message ||
          "Unable to create order"
        );

      }


      const paymentSessionId =
        data.payment_session_id ||
        data.order?.payment_session_id;


      if(!paymentSessionId){

        throw new Error(
          "payment_session_id not received from backend"
        );

      }


      setStatus(
        "Opening payment..."
      );


      const checkoutOptions = {

        paymentSessionId:
          paymentSessionId,

        redirectTarget:
          "_self"

      };


      await cashfree.checkout(
        checkoutOptions
      );


    }
    catch(error){

      console.error(error);

      loading(false);

      setStatus(
        error.message ||
        "Payment error"
      );

    }

  }
);

</script>

</body>
</html>
